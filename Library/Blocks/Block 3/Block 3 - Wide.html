<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Blocks - Block 3</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--plum:#5C2D6E;--plum-light:#8B4C9E;--plum-pale:#F3EAF8;--plum-mid:#D8B4E2;--ink:#1E1A2E;--muted:#6B6478;--border:#E2D8EA;--bg:#FDFBFE;--surface:#F8F3FC;--white:#FFFFFF}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--plum);padding:2.5rem 2rem 1.5rem;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,0.04)}
.header-inner{max-width:100%;margin:0 20px;position:relative;z-index:1}
.yarn-icon{font-size:2rem;margin-bottom:.5rem;display:block;float:left;margin-top:8px;}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;color:#fff;letter-spacing:-.01em;line-height:1.2}
header p{font-size:.85rem;color:rgba(255,255,255,.6);margin-top:.4rem;font-weight:300;font-style:italic}
.progress-bar{max-width:100%;margin:0 auto;background:var(--plum);padding:0 20px 1.5rem}
.prog-track{height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--plum-mid);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%}
.prog-label{font-size:.75rem;color:rgba(255,255,255,.55);margin-top:.5rem;display:flex;justify-content:space-between}
main{max-width:100%;margin:0 auto;padding:1.5rem 20px 4rem}
.section-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:400;color:var(--plum);margin:2rem 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);font-style:italic}
.section-title:first-child{margin-top:0}
.section-note{font-size:.78rem;color:var(--muted);margin:-.3rem 0 .7rem;font-style:italic}
.abbrev-box{background:var(--plum-pale);border:1px solid var(--plum-mid);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:1.2rem;font-size:.82rem;color:var(--ink);line-height:1.6}
.abbrev-box strong{color:var(--plum);font-weight:600}
.abbrev-box code{font-family:'Calling Code',monospace;font-size:.82rem;background:rgba(92,45,110,.08);padding:1px 5px;border-radius:3px}
.rep-title{font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--plum-light);margin:1.2rem 0 .4rem;padding-left:.25rem}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--white);box-shadow:0 1px 3px rgba(92,45,110,.06)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--surface)}
th{font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:.75rem 1rem;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th:first-child{text-align:center;width:52px}
th:nth-child(2){width:145px}
th:nth-child(3){width:48px;text-align:center}
td:nth-child(3){text-align:center;vertical-align:middle}
td{padding:.85rem 1rem;border-bottom:1px solid var(--border);vertical-align:top;font-size:.87rem;line-height:1.5}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf9ff}
tr.row-done td{opacity:.38}
td:first-child{text-align:center;vertical-align:middle}
.main-cb{width:18px;height:18px;cursor:pointer;accent-color:var(--plum)}
.row-label{font-family:'Calling Code',monospace;font-weight:500;color:var(--ink);font-size:.82rem;white-space:nowrap}
.row-seed .row-label{color:var(--muted)}
.instr{font-family:'Calling Code',monospace;font-size:.82rem;color:var(--ink);line-height:1.6}
.instr u{background:#e8820c;color:#fff;border-radius:3px;padding:0 3px;text-decoration:underline;text-decoration-color:#a85c08}
.seed-border{color:#7a6e8a}
.pipe{color:#c0b8cc;font-weight:300;margin:0 2px}
.repeat-core{background:var(--plum-pale);border-radius:4px;padding:1px 6px}
.ws-tag{font-size:.68rem;font-weight:500;background:#e05555;color:#fff;border-radius:4px;padding:1px 6px;font-family:inherit}
.rs-tag{font-size:.68rem;font-weight:500;background:#4a9e6b;color:#fff;border-radius:4px;padding:1px 6px;font-family:inherit}
tr.row-ws td{background:#f7f7f7}
tr.row-ws:hover td{background:#f0f0f0}
.setup-tag{font-size:.68rem;font-weight:500;background:#fff3cd;color:#856404;border-radius:4px;padding:1px 6px;font-family:inherit}
.mb-tag{font-size:.68rem;font-weight:500;background:#fde8f0;color:#9b2556;border-radius:4px;padding:1px 6px;border:1px solid #f5c0d4;font-family:inherit}
.yo-tag{font-size:.68rem;font-weight:500;background:#e8f4ee;color:#2d6a4f;border-radius:4px;padding:1px 6px;font-family:inherit}
.tag{display:inline-block;font-size:.65rem;font-weight:500;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.tag-seed{background:#f0f0f0;color:#888}
.tag-cast{background:#e8f4ee;color:#3a7a54}
.tag-setup{background:#fff3cd;color:#856404}
.bottom-bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;margin-top:.75rem;font-size:.78rem;color:var(--muted)}
.save-msg{font-size:.72rem;color:var(--plum-light);min-height:1em;transition:opacity .3s}
.save-msg.hidden{opacity:0}
.reset-btn{font-size:.75rem;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 12px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s}
.reset-btn:hover{border-color:var(--plum-mid);color:var(--plum)}
@media (max-width: 700px){
header{padding:1.6rem 1rem 1.1rem}
.header-inner{margin:0}
.progress-bar{padding:0 1rem 1rem}
main{padding:1rem .75rem 3rem}
.abbrev-box{padding:.75rem .8rem;border-radius:8px}
.table-wrap{border-radius:8px}
th,td{padding:.65rem .55rem}
th:first-child{width:44px}
th:nth-child(2){width:clamp(96px,30vw,145px)}
th:nth-child(3){width:42px}
.row-label{font-size:.78rem}
.instr{font-size:.78rem;line-height:1.55}
.bottom-bar{gap:1rem;align-items:flex-start}
}
@media (max-width: 430px){
.yarn-icon{float:none;display:inline-block;margin:0 .35rem .35rem 0}
header h1{font-size:1.45rem}
header p{font-size:.78rem}
.prog-label{gap:.75rem}
th,td{padding:.55rem .45rem}
.tag,.ws-tag,.rs-tag,.setup-tag,.inc-tag,.dec-tag,.mb-tag,.yo-tag{font-size:.6rem;padding:1px 4px}
}

</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="yarn-icon">🧶</span>
    <h1>Building Blocks — Block 3</h1>
    <p>Yarn Over and Bobbles &nbsp;·&nbsp; Brought to you by Michelle Hunter of Knit Purl Hunter</p>
  </div>
</header>
<div class="progress-bar">
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <div class="prog-label">
    <span id="prog-text">0 of 0 rows complete</span>
    <span id="prog-pct">0%</span>
  </div>
</div>
<main id="main-content"></main>

<script>
const STORAGE_KEY = 'block3-pattern-v1';

// Body: 12-row repeat × 5
// Set Up Row acts as Row 1 of Rep 1 → Rep 1 starts at Row 2
// Reps 2–5: full 12-row repeats (Rows 1–12)
// Pattern says "Work above rows 5 times, ending last repeat after Row 12"
// → 5 reps total: Rep 1 (Rows 2–12) + Reps 2–5 (Rows 1–12)

const allBodyRows = [
  { row:  1, side: 'RS', instr: '[RS] [SeedO] K6, *[MB], K8; repeat from * ending last repeat with K6 instead of K8 [SeedO]' },
  { row:  2, side: 'WS', instr: '[WS] [SeedE] Purl across 40 body sts [SeedE]' },
  { row:  3, side: 'RS', instr: '[RS] [SeedO] Knit across 40 body sts [SeedO]' },
  { row:  4, side: 'WS', instr: '[WS] [SeedE] Purl across 40 body sts [SeedE]' },
  { row:  5, side: 'RS', instr: '[RS] [SeedO] Knit across 40 body sts [SeedO]' },
  { row:  6, side: 'RS', instr: '[RS] [SeedO] Knit across 40 body sts [SeedO]' },
  { row:  7, side: 'RS', instr: '[RS] [SeedO] [YO] *K2tog, yo; repeat from * to end of body sts [SeedO] — check: 40 sts' },
  { row:  8, side: 'RS', instr: '[RS] [SeedO] Knit across 40 body sts [SeedO]' },
  { row:  9, side: 'RS', instr: '[RS] [SeedO] Knit across 40 body sts [SeedO]' },
  { row: 10, side: 'WS', instr: '[WS] [SeedE] Purl across 40 body sts [SeedE]' },
  { row: 11, side: 'RS', instr: '[RS] [SeedO] Knit across 40 body sts [SeedO]' },
  { row: 12, side: 'WS', instr: '[WS] [SeedE] Purl across 40 body sts [SeedE]' },
];

function bodyRows(repNum, startRow, endRow) {
  return allBodyRows
    .filter(r => r.row >= startRow && r.row <= endRow)
    .map(r => ({
      id: `r${repNum}-${r.row}`,
      label: `Rep ${repNum} · Row ${r.row}`,
      instr: r.instr,
      side: r.side,
      type: 'body'
    }));
}

const bodySection = [];
bodySection.push(...bodyRows(1, 2, 12));
for (let rep = 2; rep <= 5; rep++) {
  bodySection.push(...bodyRows(rep, 1, 12));
}

const sections = [
  {
    id: 'abbrev',
    title: 'Special Abbreviation',
    abbrev: true,
    rows: []
  },
  {
    id: 'cast-on',
    title: 'Cast On',
    note: '48 stitches using Long Tail Cast On',
    rows: [
      { id: 'co', label: 'Cast on', instr: '48 sts — Long Tail Cast On method', type: 'cast' }
    ]
  },
  {
    id: 'bottom-border',
    title: 'Bottom Border',
    note: 'Work 6 rows of seed stitch',
    rows: [
      { id: 'bb1', label: 'Row 1', instr: '*K1, p1; repeat from *', type: 'seed' },
      { id: 'bb2', label: 'Row 2', instr: '*P1, k1; repeat from *', type: 'seed' },
      { id: 'bb3', label: 'Row 3', instr: '*K1, p1; repeat from *', type: 'seed' },
      { id: 'bb4', label: 'Row 4', instr: '*P1, k1; repeat from *', type: 'seed' },
      { id: 'bb5', label: 'Row 5', instr: '*K1, p1; repeat from *', type: 'seed' },
      { id: 'bb6', label: 'Row 6', instr: '*P1, k1; repeat from *', type: 'seed' },
    ]
  },
  {
    id: 'setup',
    title: 'Set Up Row',
    note: 'Worked ONCE — replaces Row 1 of Rep 1. Continue with Row 2.',
    rows: [
      { id: 'sur', label: 'Set Up Row', instr: '[Setup] [SeedO] Knit across all 40 body stitches [SeedO]', type: 'setup' }
    ]
  },
  {
    id: 'body',
    title: 'Body',
    note: 'Seed stitch over first & last 4 sts every row · Design over 40 center sts · 12-row repeat × 5 · Rep 1 begins at Row 2',
    rows: bodySection
  },
  {
    id: 'top-border',
    title: 'Top Border',
    note: 'Work 5 rows seed stitch ending after Row 1 · Bind off in pattern',
    rows: [
      { id: 'tb1', label: 'Row 1', instr: '*K1, p1; repeat from *', type: 'seed' },
      { id: 'tb2', label: 'Row 2', instr: '*P1, k1; repeat from *', type: 'seed' },
      { id: 'tb3', label: 'Row 3', instr: '*K1, p1; repeat from *', type: 'seed' },
      { id: 'tb4', label: 'Row 4', instr: '*P1, k1; repeat from *', type: 'seed' },
      { id: 'tb5', label: 'Row 5', instr: '*K1, p1; repeat from * — bind off in pattern', type: 'seed' },
    ]
  }
];

// ── State ──────────────────────────────────────────────────────────────────────
let state = {};

function allIds() {
  return sections.flatMap(s => s.rows.map(r => r.id));
}

function buildDefault() {
  return Object.fromEntries(allIds().map(id => [id, false]));
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    state = saved && typeof saved === 'object' ? { ...buildDefault(), ...saved } : buildDefault();
  } catch { state = buildDefault(); }
}

let saveTimer;
function schedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const msg = document.getElementById('save-msg');
    if (msg) { msg.classList.remove('hidden'); setTimeout(() => msg.classList.add('hidden'), 1800); }
  }, 400);
}

function updateProgress() {
  const ids = allIds();
  const done = ids.filter(id => state[id]).length;
  const pct = ids.length ? Math.round(done / ids.length * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${done} of ${ids.length} rows complete`;
  document.getElementById('prog-pct').textContent = pct + '%';
}

// ── Tag helpers ────────────────────────────────────────────────────────────────
function tagHTML(type) {
  if (type === 'seed')  return '<span class="tag tag-seed">Seed</span>';
  if (type === 'cast')  return '<span class="tag tag-cast">Cast On</span>';
  if (type === 'setup') return '<span class="tag tag-setup">Set Up</span>';
  return '';
}

// ── renderRow ──────────────────────────────────────────────────────────────────
// Token pipeline order:
//   1. Detect [WS]/[RS] for side; strip both
//   2. [SeedO]/[SeedE] → §SEED§...§/SEED§ placeholders
//   3. [Setup]/[Inc]/[Dec] stripped
//   4. repeat-core regex (§ stop char)
//   5. §SEED§ resolved → seed | ... | seed
//   6. [YO] / [MB] badges
function renderRow(row) {
  const tr = document.createElement('tr');
  tr.id = 'row-' + row.id;
  if (state[row.id]) tr.classList.add('row-done');
  if (row.type === 'seed') tr.classList.add('row-seed');

  const isWS = row.instr.startsWith('[WS]');
  if (isWS && row.type === 'body') tr.classList.add('row-ws');

  // Checkbox
  const tdDone = document.createElement('td');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'main-cb'; cb.checked = !!state[row.id];
  cb.addEventListener('change', () => {
    state[row.id] = cb.checked;
    tr.classList.toggle('row-done', cb.checked);
    updateProgress(); schedSave();
  });
  tdDone.appendChild(cb);

  // Label
  const tdLabel = document.createElement('td');
  tdLabel.innerHTML = `<span class="row-label">${row.label}</span>`;

  // Badge
  const tdSide = document.createElement('td');
  if (row.type === 'body') {
    tdSide.innerHTML = isWS ? '<span class="ws-tag">WS</span>' : '<span class="rs-tag">RS</span>';
  } else if (row.type === 'setup') {
    tdSide.innerHTML = '<span class="setup-tag">Set Up</span>';
  } else {
    tdSide.innerHTML = tagHTML(row.type);
  }

  // Instructions — token pipeline
  const tdInstr = document.createElement('td');
  tdInstr.className = 'instr';

  let html = row.instr;
  html = html.replace(/\[WS\]/g, '').replace(/\[RS\]/g, '');
  html = html.replace(/\[SeedO\]/g, '§SEED§K1, p1, K1, p1§/SEED§');
  html = html.replace(/\[SeedE\]/g, '§SEED§P1, k1, P1, k1§/SEED§');
  html = html.replace(/\[Setup\]/g, '').replace(/\[Inc\]/g, '').replace(/\[Dec\]/g, '');
  html = html.replace(/(\*[^*]+; repeat from \*[^§<\n]*)/g, '<span class="repeat-core">$1</span>');
  let seedCount = 0;
  html = html.replace(/§SEED§(.*?)§\/SEED§/g, (_, sts) => {
    seedCount++;
    const s = `<span class="seed-border">${sts}</span>`;
    return seedCount === 1
      ? s + ' <span class="pipe">|</span>'
      : '<span class="pipe">|</span> ' + s;
  });
  html = html.replace(/\[YO\]/g, '<span class="yo-tag">YO</span>');
  html = html.replace(/\[MB\]/g, '<span class="mb-tag">MB</span>');

  tdInstr.innerHTML = html.trim();

  tr.appendChild(tdDone);
  tr.appendChild(tdLabel);
  tr.appendChild(tdSide);
  tr.appendChild(tdInstr);
  return tr;
}

// ── Table builder ──────────────────────────────────────────────────────────────
function makeTable(rows) {
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Done</th><th>Row</th><th></th><th>Instructions</th></tr>';
  const tbody = document.createElement('tbody');
  rows.forEach(r => tbody.appendChild(renderRow(r)));
  tbl.appendChild(thead);
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  return wrap;
}

// ── UI builder ─────────────────────────────────────────────────────────────────
function buildUI() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';

  sections.forEach(section => {
    if (section.abbrev) {
      const title = document.createElement('p');
      title.className = 'section-title';
      title.textContent = section.title;
      main.appendChild(title);
      const box = document.createElement('div');
      box.className = 'abbrev-box';
      box.innerHTML =
        '<strong>MB (Make Bobble):</strong> <code>(K1, yo, k1, yo, k1) into next stitch</code>, turn, k5, turn, p5, turn, k2tog, k1, k2tog, turn, p3tog. ' +
        '<em>Increases 1 stitch to 5, works several short rows, then decreases back to 1 stitch.</em>';
      main.appendChild(box);
      return;
    }

    const title = document.createElement('p');
    title.className = 'section-title';
    title.textContent = section.title;
    main.appendChild(title);

    if (section.note) {
      const note = document.createElement('p');
      note.className = 'section-note';
      note.textContent = section.note;
      main.appendChild(note);
    }

    if (section.id === 'body') {
      const repMap = new Map();
      section.rows.forEach(r => {
        const match = r.id.match(/^r(\d+)-/);
        const key = match ? `Rep ${match[1]}` : 'Other';
        if (!repMap.has(key)) repMap.set(key, []);
        repMap.get(key).push(r);
      });
      repMap.forEach((rows, repLabel) => {
        const repTitle = document.createElement('p');
        repTitle.className = 'rep-title';
        const repNum = parseInt(repLabel.replace('Rep ', ''));
        repTitle.textContent = repNum === 1
          ? 'Rep 1 — begins at Row 2 (Set Up Row used in place of Row 1)'
          : repLabel;
        main.appendChild(repTitle);
        main.appendChild(makeTable(rows));
      });
    } else {
      main.appendChild(makeTable(section.rows));
    }
  });

  const bar = document.createElement('div');
  bar.className = 'bottom-bar';
  bar.innerHTML = '<span class="save-msg hidden" id="save-msg">✓ Progress saved</span><button class="reset-btn" onclick="resetAll()">Reset all</button>';
  main.appendChild(bar);
}

function resetAll() {
  if (!confirm('Reset all checkboxes?')) return;
  state = buildDefault();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  buildUI(); updateProgress();
}

loadState(); buildUI(); updateProgress();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="824" viewBox="0 0 560 824" role="img" aria-label="Travel Time Cowl traveling rib chart, 10 stitches by 16 rows">
<title>Travel Time Cowl — Traveling Rib Chart</title>
<desc>Cable panel of the Travel Time Cowl: multiple of 6 stitches plus 4, shown over 10 stitches (1 repeat + 4), 16 rows. Worked flat; right-side rows are read right to left, wrong-side rows left to right. The red outline marks the 6-stitch repeat.</desc>
<rect width="560" height="824" fill="#FFFFFF"/>
<text x="64" y="44" font-family="'Playfair Display',Georgia,serif" font-size="22" font-weight="600" font-style="normal" fill="#5C2D6E" text-anchor="start">Travel Time — Traveling Rib Chart</text>
<text x="64" y="66" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#6B6478" text-anchor="start">Multiple of 6 sts + 4  ·  16 rows  ·  shown over 10 sts (1 repeat + 4)</text>
<text x="64" y="82" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#6B6478" text-anchor="start">Worked flat — RS rows (odd) read right to left, WS rows (even) read left to right.</text>
<text x="64" y="98" font-family="'Source Sans 3','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#6B6478" text-anchor="start">Cowl: worked over the centre 40 sts (6 repeats + 4), between 5-st seed-stitch edges.</text>

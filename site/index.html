  <style>
    :root {
      color-scheme: light dark;
      --bg: #faf6f1;
      --surface: #ffffff;
      --panel: #f3eaf8;
      --ink: #241c2c;
      --muted: #6b6478;
      --line: #e6dde9;
      --brand: #5c2d6e;
      --brand-hover: #4a2259;
      --on-brand: #ffffff;
      --link: #5c2d6e;
      --focus: #e8820c;
      --c-blocks: #5c2d6e;
      --c-cowls: #b35a00;
      --c-hats: #2d6a4f;
      --c-shirts: #1d5f8f;
      --shadow: 0 1px 2px rgba(36, 28, 44, 0.06), 0 4px 14px rgba(36, 28, 44, 0.05);
      --shadow-hover: 0 2px 4px rgba(36, 28, 44, 0.08), 0 10px 24px rgba(36, 28, 44, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16111b;
        --surface: #201826;
        --panel: #271d30;
        --ink: #f1ebf5;
        --muted: #a99fb6;
        --line: #3a2e45;
        --brand: #8b4c9e;
        --brand-hover: #9d5db1;
        --link: #d8b4e2;
        --c-blocks: #d8b4e2;
        --c-cowls: #f0a04b;
        --c-hats: #7cc9a0;
        --c-shirts: #7fb8e6;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 8px 22px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 48px;
    }

    /* Header: brand + search on one row, filter chips below */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .hero-title-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.5rem, 3vw, 1.9rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .summary {
      margin: 2px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .search {
      position: relative;
      flex: 1 1 280px;
      max-width: 380px;
    }

    .search svg {
      position: absolute;
      top: 50%;
      left: 13px;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
    }

    .search input::placeholder { color: var(--muted); }

    .search input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 22px;
    }

    .filter {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .filter:hover { border-color: var(--brand); }

    .filter .count {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
    }

    .filter[aria-pressed="true"] {
      color: var(--on-brand);
      background: var(--brand);
      border-color: var(--brand);
    }

    .filter[aria-pressed="true"] .count { color: inherit; opacity: 0.8; }

    /* Sections */
    .section + .section { margin-top: 28px; }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 14px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.3rem;
      line-height: 1.2;
    }

    .section-note {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .blocks-panel {
      padding: 14px;
      border-radius: 18px;
      background: var(--panel);
    }

    /* Building Blocks tiles */
    .tile-grid {
      display: grid;
      gap: 10px;
      /* 12 blocks: 6, 4 or 2 columns so the last row is never a stray tile or two */
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 11px 12px 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
    }

    .tile:hover,
    .tile:focus-within {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: var(--shadow-hover);
    }

    .tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--c-blocks);
    }

    .tile-open {
      font-size: 0.9rem;
      letter-spacing: 0;
      color: var(--muted);
    }

    .tile:hover .tile-open { color: var(--brand); }

    .tile-title {
      margin: 0;
      min-height: 2.5em;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.02rem;
      line-height: 1.25;
    }

    /* Stretched link: the whole tile opens the HTML, PDF links sit above it */
    .tile-title a { text-decoration: none; }
    .tile-title a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 12px;
    }

    .tile-pdfs {
      display: flex;
      flex-wrap: wrap;
      gap: 0 2px;
      margin: 2px -6px 0;
    }

    .tile-pdfs a {
      position: relative;
      z-index: 1;
      padding: 4px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--link);
      text-decoration: none;
      border-radius: 6px;
    }

    .tile-pdfs a:hover { text-decoration: underline; }

    /* Pattern cards */
    .card-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }

    .card {
      --cat: var(--c-blocks);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px 16px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--cat);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: box-shadow 140ms ease;
    }

    .card:hover { box-shadow: var(--shadow-hover); }
    .card.cat-cowls { --cat: var(--c-cowls); }
    .card.cat-hats { --cat: var(--c-hats); }
    .card.cat-shirts { --cat: var(--c-shirts); }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cat);
    }

    .card-title {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .card-blurb {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .size-chip {
      min-height: 28px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    .size-chip:hover { border-color: var(--cat); }

    .size-chip[aria-pressed="true"] {
      color: var(--on-brand);
      background: var(--brand);
      border-color: var(--brand);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      padding-top: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--link);
      text-decoration: none;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .btn:hover { border-color: var(--brand); }

    .btn.primary {
      padding: 0 15px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--on-brand);
      background: var(--brand);
      border-color: var(--brand);
    }

    .btn.primary:hover { background: var(--brand-hover); }
    .btn.primary::after { content: "\2197"; margin-left: 6px; }

    .empty {
      padding: 28px;
      border-radius: 14px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line);
    }

    @media (max-width: 960px) {
      .tile-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .page { width: calc(100% - 24px); padding-top: 14px; }
      .search { max-width: none; flex-basis: 100%; }
      .blocks-panel { padding: 10px; }
      .tile-grid { gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .tile:hover, .tile:focus-within { transform: none; }
    }
  </style>
</head>

      },
      {

        group: "highstyle",
        path: "library/high-style/high-style.html",
        url: `${DEFAULT_BUCKET_URL}/library/high-style/high-style.html`,

        pdfLetter: `${DEFAULT_BUCKET_URL}/library/high-style/high-style-letter.pdf`,
        chart: `${DEFAULT_BUCKET_URL}/library/high-style/high-style-chart.svg`,
        original: `${DEFAULT_BUCKET_URL}/library/high-style/high-style-original.pdf`,
      },
      {
        title: "Travel Time Cowl",
        group: "traveltime",
        path: "library/travel-time/travel-time.html",
        url: `${DEFAULT_BUCKET_URL}/library/travel-time/travel-time.html`,
        pdfA4: `${DEFAULT_BUCKET_URL}/library/travel-time/travel-time-a4.pdf`,
        pdfLetter: `${DEFAULT_BUCKET_URL}/library/travel-time/travel-time-letter.pdf`,
        chart: `${DEFAULT_BUCKET_URL}/library/travel-time/travel-time-chart.svg`,
        original: `${DEFAULT_BUCKET_URL}/library/travel-time/travel-time-original.pdf`,
      },
    ];

    const CATEGORIES = [
      { id: "all", label: "All" },
      { id: "blocks", label: "Building Blocks" },
      { id: "cowls", label: "Cowls" },
      { id: "hats", label: "Hats" },
      { id: "shirts", label: "Shirts" },
    ];

    const TAG_LABEL = { cowls: "Cowl", hats: "Hat", shirts: "Shirt" };

    // Display order of the non-Building-Blocks patterns.
    const GROUPS = [
      { id: "coventry", category: "cowls", title: "Coventry Cables & Lace Cowl", blurb: "Expanded checklist for the elongated braided cable cowl." },
      { id: "tangerine", category: "cowls", title: "Tangerine Twist Cowl", blurb: "Super bulky cabled cowl, all 35 rounds." },
      { id: "highstyle", category: "cowls", title: "High Style Cowl", blurb: "Anne Jones chunky cabled cowl, all 39 chart rounds." },
      { id: "traveltime", category: "cowls", title: "Travel Time Cowl", blurb: "Faina Goberstein traveling cable cowl with moss stitch edges, 50 sts." },
      { id: "antler", category: "hats", title: "Antler Toque", blurb: "Four sizes, from baby to adult large." },
      { id: "rafas", category: "hats", title: "Rafa's Hat", blurb: "Three sizes: small, medium, and large." },
      { id: "anker", category: "shirts", title: "Anker's Summer Shirt", blurb: "Medium and large." },
    ];

    const BLOCKS = PATTERN_FILES.filter((file) => file.group === "blocks");
    const variantsOf = (groupId) => PATTERN_FILES.filter((file) => file.group === groupId);

    const state = { query: "", category: "all", selected: {} };

    const els = {
      search: document.getElementById("search"),
      summary: document.getElementById("summary"),
      filterBar: document.getElementById("filter-bar"),
      blocksSection: document.getElementById("blocks-section"),
      blocksGrid: document.getElementById("blocks-grid"),
      patternsSection: document.getElementById("patterns-section"),
      patternsGrid: document.getElementById("patterns-grid"),
      empty: document.getElementById("empty"),
    };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function externalLink(href, label, className, ariaLabel, download) {
      return `<a class="${className}" href="${escapeHtml(href)}" target="_blank" rel="noreferrer"`
        + ` aria-label="${escapeHtml(ariaLabel)}"${download ? " download" : ""}>${label}</a>`;
    }

    function matchesQuery(text) {
      const words = state.query.toLowerCase().split(/\s+/).filter(Boolean);
      const haystack = text.toLowerCase();
      return words.every((word) => haystack.includes(word));
    }

    function categoryCount(categoryId) {
      if (categoryId === "all") {
        return BLOCKS.length + GROUPS.length;
      }
      if (categoryId === "blocks") {
        return BLOCKS.length;
      }
      return GROUPS.filter((group) => group.category === categoryId).length;
    }

    function visibleBlocks() {
      if (state.category !== "all" && state.category !== "blocks") {
        return [];
      }
      return BLOCKS.filter((block) => matchesQuery(`block ${block.number} ${block.label} building blocks`));
    }

    function visibleGroups() {
      return GROUPS.filter((group) => {
        if (state.category !== "all" && state.category !== group.category) {
          return false;
        }
        const sizes = variantsOf(group.id).map((variant) => variant.label || "").join(" ");
        return matchesQuery(`${group.title} ${group.blurb} ${TAG_LABEL[group.category]} ${sizes}`);
      });
    }

    function tileHtml(block) {
      const name = `Block ${block.number}, ${block.label}`;
      return `
        <article class="tile">
          <div class="tile-top"><span>Block ${block.number}</span><span class="tile-open" aria-hidden="true">&#8599;</span></div>
          <h3 class="tile-title">
            <a href="${escapeHtml(block.url)}" target="_blank" rel="noreferrer" aria-label="Open ${escapeHtml(name)}">${escapeHtml(block.label)}</a>
          </h3>
          <div class="tile-pdfs">
            ${externalLink(block.pdfA4, "A4", "", `${name}, A4 PDF`, true)}
            ${externalLink(block.pdfLetter, "Letter", "", `${name}, Letter PDF`, true)}
            ${externalLink(block.original, "Original", "", `${name}, original PDF`, true)}
          </div>
        </article>
      `;
    }

    function actionsHtml(item) {
      const links = [externalLink(item.url, "Open", "btn primary", `Open ${item.title}`, false)];
      if (item.pdfA4) {
        links.push(externalLink(item.pdfA4, "A4", "btn", `${item.title}, A4 PDF`, true));
      }
      if (item.pdfLetter) {
        links.push(externalLink(item.pdfLetter, "Letter", "btn", `${item.title}, Letter PDF`, true));
      }
      if (item.chart) {
        links.push(externalLink(item.chart, "Chart", "btn", `${item.title}, chart SVG`, false));
      }
      if (item.original) {
        links.push(externalLink(item.original, "Original", "btn", `${item.title}, original PDF`, true));
      }
      return links.join("");
    }

    function cardHtml(group) {
      const variants = variantsOf(group.id);
      const index = Math.min(state.selected[group.id] || 0, variants.length - 1);
      const sizes = variants.length > 1
        ? `<div class="sizes" role="group" aria-label="${escapeHtml(group.title)} size">${variants.map((variant, i) =>
            `<button class="size-chip" type="button" data-index="${i}" aria-pressed="${i === index}">${escapeHtml(variant.label)}</button>`
          ).join("")}</div>`
        : "";

      return `
        <article class="card cat-${group.category}" data-group="${group.id}">
          <span class="tag">${TAG_LABEL[group.category]}</span>
          <h3 class="card-title">${escapeHtml(group.title)}</h3>
          <p class="card-blurb">${escapeHtml(group.blurb)}</p>
          ${sizes}
          <div class="actions">${actionsHtml(variants[index])}</div>
        </article>
      `;
    }

    function render() {
      const blocks = visibleBlocks();
      const groups = visibleGroups();
      const shown = blocks.length + groups.length;
      const total = categoryCount("all");

      els.blocksGrid.innerHTML = blocks.map(tileHtml).join("");
      els.patternsGrid.innerHTML = groups.map(cardHtml).join("");
      els.blocksSection.hidden = !blocks.length;
      els.patternsSection.hidden = !groups.length;
      els.empty.hidden = shown > 0;

      els.summary.textContent = shown === total
        ? `${total} patterns, ${PATTERN_FILES.length} published pages`
        : `Showing ${shown} of ${total} patterns`;
    }

    function initFilters() {
      els.filterBar.innerHTML = CATEGORIES.map((category) =>
        `<button class="filter" type="button" data-filter="${category.id}" aria-pressed="${category.id === state.category}">`
        + `${escapeHtml(category.label)} <span class="count">${categoryCount(category.id)}</span></button>`
      ).join("");

      els.filterBar.addEventListener("click", (event) => {
        const button = event.target.closest("[data-filter]");
        if (!button) {
          return;
        }
        state.category = button.dataset.filter;
        els.filterBar.querySelectorAll(".filter").forEach((chip) => {
          chip.setAttribute("aria-pressed", String(chip === button));
        });
        render();
      });
    }

    function initSizePicker() {
      // Update the card in place so keyboard focus stays on the chip that was pressed.
      els.patternsGrid.addEventListener("click", (event) => {
        const chip = event.target.closest(".size-chip");
        if (!chip) {
          return;
        }
        const card = chip.closest(".card");
        const index = Number(chip.dataset.index);
        state.selected[card.dataset.group] = index;
        card.querySelectorAll(".size-chip").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === chip));
        });
        card.querySelector(".actions").innerHTML = actionsHtml(variantsOf(card.dataset.group)[index]);
      });
    }

    function init() {
      els.search.addEventListener("input", (event) => {
        state.query = event.target.value;
        render();
      });

      initFilters();
      initSizePicker();
      render();
    }

    init();
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coventry Cables &amp; Lace Cowl - Expanded Pattern</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--plum:#5C2D6E;--plum-light:#8B4C9E;--plum-pale:#F3EAF8;--plum-mid:#D8B4E2;--ink:#1E1A2E;--muted:#6B6478;--border:#E2D8EA;--bg:#FDFBFE;--surface:#F8F3FC;--white:#FFFFFF;--green:#4A7C5C;--red:#9A3F4F}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
header{background:var(--plum);padding:2.5rem 2rem 1.5rem;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,0.04)}
.header-inner{max-width:1100px;margin:0 auto;position:relative;z-index:1}
.yarn-icon{font-size:2rem;margin-bottom:.5rem;display:block}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;color:#fff;letter-spacing:-.01em;line-height:1.2}
.subtitle{font-size:.85rem;color:rgba(255,255,255,.6);margin-top:.4rem;font-weight:300;font-style:italic}
.toolbar{background:var(--plum);padding:0 2rem 1.5rem}
.toolbar-inner{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(230px,auto) minmax(260px,1fr);gap:1.25rem;align-items:end}
.toolbar .meta{display:block;color:rgba(255,255,255,.55);font-size:.75rem;margin:0 0 .45rem}
.segmented{display:inline-grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(255,255,255,.22);border-radius:6px;overflow:hidden;background:rgba(255,255,255,.08)}
.segmented button{border:0;border-right:1px solid rgba(255,255,255,.22);background:transparent;color:rgba(255,255,255,.72);padding:5px 12px;font-family:inherit;font-size:.75rem;cursor:pointer;transition:background .15s,color .15s}
.segmented button:last-child{border-right:0}
.segmented button.active{background:var(--plum-mid);color:var(--plum)}
.progress-label{font-size:.75rem;color:rgba(255,255,255,.55);margin-top:.5rem;display:flex;justify-content:space-between}
.track{height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--plum-mid);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%}
main{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 4rem}
.note{color:var(--muted);font-size:.86rem;line-height:1.5;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:.8rem 1rem;box-shadow:0 1px 3px rgba(92,45,110,.04)}
h2{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:400;color:var(--plum);margin:2rem 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);font-style:italic}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--white);box-shadow:0 1px 3px rgba(92,45,110,.06)}
table{width:100%;border-collapse:collapse;min-width:820px}
thead tr{background:var(--surface)}
th{font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:.75rem 1rem;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th:first-child,td:first-child{text-align:center;width:52px}
th:nth-child(2){width:160px}
th:nth-child(3){width:56px;text-align:center}
td{padding:.9rem 1rem;border-bottom:1px solid var(--border);vertical-align:top;font-size:.87rem;line-height:1.5}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fdf9ff}
tr.ws td{background:#f7f7f7}
tr.rs td{background:#fefbff}
tr.done td{opacity:.4}
input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--plum)}
.round{font-weight:500;color:var(--ink);font-size:.88rem;white-space:nowrap}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:42px;border-radius:4px;padding:2px 6px;font-size:.68rem;font-weight:500}
.badge.rs{background:#DDECDD;color:var(--green)}
.badge.ws{background:#F4E0E4;color:var(--red)}
.badge.setup{background:var(--plum-pale);color:var(--plum)}
.badge.finish{background:#f0f0f0;color:#777}
.instr{color:var(--muted);font-size:.82rem;line-height:1.5}
.repeat-compact{font-family:monospace;font-size:.79rem;color:var(--ink)}
.repeat-core{background:var(--plum-pale);border-radius:5px;padding:.12rem .28rem}
.repeat-count{font-family:'Source Sans 3',sans-serif;font-size:.72rem;color:var(--muted);margin-left:.35rem;white-space:nowrap}
.plain{font-family:monospace;color:var(--muted)}
.meta{color:var(--muted);font-size:.75rem;margin-top:.4rem}
.actions{display:flex;align-items:center;justify-content:flex-end;padding:.75rem 0;margin-top:.75rem}
.reset-btn{font-size:.75rem;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 12px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s}
.reset-btn:hover{border-color:var(--plum-mid);color:var(--plum)}
@media (max-width:720px){
  header{padding:2rem 1.25rem 1.25rem}
  .toolbar{padding:0 1.25rem 1.25rem}
  .toolbar-inner{grid-template-columns:1fr;gap:.9rem}
  .segmented{width:100%}
}
@media print{
  .toolbar,.actions{display:none}
  body{background:var(--bg)}
  header{background:var(--plum);padding:2.5rem 2rem 1.5rem;color:#fff}
  header h1{color:#fff}
  .subtitle{color:rgba(255,255,255,.6)}
  .table-wrap{border-color:#bbb}
  th{background:#eee;color:#000}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="yarn-icon" aria-hidden="true">🧶</span>
    <h1>Coventry Cables &amp; Lace Cowl</h1>
    <p class="subtitle">by Donna Brooks &nbsp;·&nbsp; ©D&amp;M DesignWorks 2014 &nbsp;·&nbsp; Expanded Elongated, Braided Cable version</p>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div>
      <span class="meta">Cast-on repeat count</span>
      <div class="segmented" role="group" aria-label="Repeat count">
        <button type="button" data-repeats="4" class="active">4 repeats</button>
        <button type="button" data-repeats="6">6 repeats</button>
        <button type="button" data-repeats="8">8 repeats</button>
      </div>
    </div>
    <div class="progress">
      <div class="progress-label"><span id="progressText">0 of 0 complete</span><span id="progressPct">0%</span></div>
      <div class="track"><div class="fill" id="progressFill"></div></div>
    </div>
  </div>
</div>

<main>
  <p class="note" id="sizeNote"></p>
  <section id="setup"></section>
  <section id="body"></section>
  <section id="finishing"></section>
  <div class="actions"><button type="button" class="reset-btn" id="resetBtn">Reset checkboxes</button></div>
</main>

<script>
const STORAGE_KEY = "coventry-expanded-cowl-v1";

const sizes = {
  4: { castOn: 112, note: "Small cowl: 4 repeats x 28 stitches = 112 stitches." },
  6: { castOn: 168, note: "Medium cowl: 6 repeats x 28 stitches = 168 stitches." },
  8: { castOn: 224, note: "Large cowl or infinity scarf: 8 repeats x 28 stitches = 224 stitches." }
};

const setup = [
  { id:"setup-1", label:"Setup Round 1", badge:"Setup", text:"Place marker to designate beginning of round, join and knit." },
  { id:"setup-2", label:"Setup Round 2", badge:"Setup", text:"Purl." },
  { id:"setup-3", label:"Setup Round 3", badge:"Setup", text:"Knit." },
  { id:"setup-4", label:"Setup Round 4", badge:"Setup", text:"Purl." },
  { id:"setup-5", label:"Setup Round 5", badge:"Setup", text:"Knit." },
  { id:"setup-6", label:"Setup Round 6", badge:"Setup", repeat:"P3, K6, P3, K16", note:"Place markers at the start of each 28-stitch repeat. Use a different marker for the beginning of round." },
  { id:"setup-7", label:"Setup Round 7", badge:"Setup", repeat:"P3, K6, P3, K16" }
];

const body = [
  { n:1, side:"RS", repeat:"P3, K6, P3, K5, YO, SSK, K2, YO, SSK, K5" },
  { n:2, side:"WS", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { n:3, side:"RS", repeat:"P3, K6, P3, K3, K2tog, YO, K1, YO, SSK, K2, YO, SSK, K4" },
  { n:4, side:"WS", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { n:5, side:"RS", repeat:"P3, K2, C4B, P3, K2, K2tog, YO, K3, YO, SSK, K2, YO, SSK, K3" },
  { n:6, side:"WS", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { n:7, side:"RS", repeat:"P3, C4F, K2, P3, K1, K2tog, YO, K2, K2tog, YO, K1, YO, SSK, K2, YO, SSK, K2" },
  { n:8, side:"WS", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { n:9, side:"RS", repeat:"P3, K2, C4B, P3, K2tog, YO, K2, K2tog, YO, K3, YO, SSK, K2, YO, SSK, K1" },
  { n:10, side:"WS", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { n:11, side:"RS", repeat:"P3, C4F, K2, P3, K2, YO, SSK, K2, YO, SSK, YO, K2tog, YO, K2, K2tog, YO, K2tog" },
  { n:12, side:"WS", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { n:13, side:"RS", repeat:"P3, K6, P3, K3, YO, SSK, K2, YO, SK2P, YO, K2, K2tog, YO, K2" },
  { n:14, side:"WS", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { n:15, side:"RS", repeat:"P3, K6, P3, K4, YO, SSK, K2, YO, SSK, K1, K2tog, YO, K3" },
  { n:16, side:"WS", repeat:"P3, K6, P3, K16", note:"End of repeat. Knit the knit stitches and purl the purl stitches." }
];

const finishing = [
  { id:"finish-1", label:"Finishing Round 1", badge:"Finish", repeat:"P3, K6, P3, K16", note:"Knit the knit stitches and purl the purl stitches." },
  { id:"finish-2", label:"Finishing Round 2", badge:"Finish", text:"Purl." },
  { id:"finish-3", label:"Finishing Round 3", badge:"Finish", text:"Knit." },
  { id:"finish-4", label:"Finishing Round 4", badge:"Finish", text:"Purl." },
  { id:"bind-off", label:"Bind off", badge:"Finish", text:"Bind off using traditional bind-off: K2, slip the first stitch over the second stitch on the right needle, K1; repeat until the end. Keep the bind-off loose." },
  { id:"block", label:"Shape and block", badge:"Finish", text:"Shape and block the finished cowl." }
];

let repeatCount = Number(localStorage.getItem(STORAGE_KEY + "-repeats")) || 4;
let checks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

function esc(value){
  return String(value).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}

function compactRepeat(repeat){
  return `<span class="repeat-compact"><span class="repeat-core">*${esc(repeat)}*</span><span class="repeat-count">repeat from * to * ${repeatCount} times</span></span>`;
}

function renderRows(rows, kind){
  return rows.map(row => {
    const id = row.id || `body-${row.n}`;
    const side = row.side || row.badge || "";
    const sideClass = row.side === "WS" ? "ws" : row.side === "RS" ? "rs" : "";
    const badgeClass = row.side ? row.side.toLowerCase() : (row.badge || "setup").toLowerCase();
    const instr = row.repeat ? compactRepeat(row.repeat) : `<span class="plain">${esc(row.text)}</span>`;
    const note = row.note ? `<p class="meta">${esc(row.note)}</p>` : "";
    return `<tr class="${sideClass}${checks[id] ? " done" : ""}" data-id="${id}">
      <td><input type="checkbox" ${checks[id] ? "checked" : ""} aria-label="${esc(row.label || "Round " + row.n)}"></td>
      <td><span class="round">${esc(row.label || "Round " + row.n)}</span></td>
      <td><span class="badge ${badgeClass}">${esc(side)}</span></td>
      <td class="instr">${instr}${note}</td>
    </tr>`;
  }).join("");
}

function table(title, rows, kind, caption){
  return `<h2>${esc(title)}</h2>${caption ? `<p class="meta">${esc(caption)}</p>` : ""}
    <div class="table-wrap"><table>
      <thead><tr><th>Done</th><th>Round</th><th></th><th>Expanded instructions</th></tr></thead>
      <tbody>${renderRows(rows, kind)}</tbody>
    </table></div>`;
}

function render(){
  document.querySelectorAll(".segmented button").forEach(btn => {
    btn.classList.toggle("active", Number(btn.dataset.repeats) === repeatCount);
  });
  document.getElementById("sizeNote").textContent = sizes[repeatCount].note + " Repeat the 16-round body until desired height, ending with Round 16.";
  document.getElementById("setup").innerHTML = table("Setup Rounds", setup, "setup");
  document.getElementById("body").innerHTML = table("Pattern Body", body, "body", "Work Rounds 1-16 as one body repeat. Repeat this 16-round sequence until desired height.");
  document.getElementById("finishing").innerHTML = table("Finishing", finishing, "finishing");
  bindChecks();
  updateProgress();
}

function bindChecks(){
  document.querySelectorAll('tbody input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", event => {
      const row = event.target.closest("tr");
      checks[row.dataset.id] = event.target.checked;
      row.classList.toggle("done", event.target.checked);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(checks));
      updateProgress();
    });
  });
}

function updateProgress(){
  const boxes = [...document.querySelectorAll('tbody input[type="checkbox"]')];
  const done = boxes.filter(box => box.checked).length;
  const pct = boxes.length ? Math.round(done / boxes.length * 100) : 0;
  document.getElementById("progressText").textContent = `${done} of ${boxes.length} complete`;
  document.getElementById("progressPct").textContent = `${pct}%`;
  document.getElementById("progressFill").style.width = pct + "%";
}

document.querySelectorAll(".segmented button").forEach(btn => {
  btn.addEventListener("click", () => {
    repeatCount = Number(btn.dataset.repeats);
    localStorage.setItem(STORAGE_KEY + "-repeats", String(repeatCount));
    render();
  });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  checks = {};
  localStorage.removeItem(STORAGE_KEY);
  render();
});

render();
</script>
</body>
</html>

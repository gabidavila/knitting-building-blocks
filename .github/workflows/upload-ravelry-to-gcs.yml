name: Upload Published Files To ravelry-for-adhd-ppl

on:
  push:
    branches:
      - master
    paths:
      - "index.html"
      - "favicon.svg"
      - "Library/**/*.html"
      - "Library/**/*.pdf"
      - ".github/workflows/upload-ravelry-to-gcs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-published-files:
    runs-on: ubuntu-latest

    env:
      PRIMARY_GCS_BUCKET: ravelry-for-adhd-ppl

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload published files
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="$(mktemp -d)"
          trap 'rm -rf "${stage_dir}"' EXIT

          rsync -a \
            --include='/index.html' \
            --include='/favicon.svg' \
            --include='/Library/' \
            --include='/Library/***' \
            --exclude='ANTLERTOQUE-tincanknits.pdf' \
            --exclude='*' \
            "./" "${stage_dir}/"

          echo "Syncing changed published files -> gs://${PRIMARY_GCS_BUCKET}"
          gcloud storage rsync "${stage_dir}" "gs://${PRIMARY_GCS_BUCKET}" \
            --recursive \
            --cache-control='no-cache, max-age=0, must-revalidate'

          echo "Refreshing Library PDF cache metadata -> gs://${PRIMARY_GCS_BUCKET}/Library/**/*.pdf"
          gcloud storage objects update "gs://${PRIMARY_GCS_BUCKET}/Library/**/*.pdf" \
            --cache-control='no-cache, max-age=0, must-revalidate'

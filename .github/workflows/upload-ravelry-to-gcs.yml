name: Upload Published Files To ravelry-for-adhd-ppl

on:
  push:
    branches:
      - master
    paths:
      - "site/index.html"
      - "site/favicon.svg"
      - "site/library/**/*.html"
      - "site/library/**/*.pdf"
      - "scripts/validate_published_site.py"
      - ".github/workflows/upload-ravelry-to-gcs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-published-files:
    runs-on: ubuntu-latest

    env:
      PRIMARY_GCS_BUCKET: ravelry-for-adhd-ppl

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload published files
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/validate_published_site.py

          stage_dir="$(mktemp -d)"
          trap 'rm -rf "${stage_dir}"' EXIT

          rsync -a \
            --include='/index.html' \
            --include='/favicon.svg' \
            --include='/library/' \
            --include='/library/***' \
            --exclude='ANTLERTOQUE-tincanknits.pdf' \
            --exclude='*' \
            "./site/" "${stage_dir}/"

          echo "Syncing changed published files -> gs://${PRIMARY_GCS_BUCKET}"
          gcloud storage rsync "${stage_dir}" "gs://${PRIMARY_GCS_BUCKET}" \
            --recursive \
            --cache-control='no-cache, max-age=0, must-revalidate'

          pdf_glob="gs://${PRIMARY_GCS_BUCKET}/library/**/*.pdf"
          if gcloud storage ls "${pdf_glob}" >/dev/null 2>&1; then
            echo "Refreshing library PDF cache metadata -> ${pdf_glob}"
            gcloud storage objects update "${pdf_glob}" \
              --cache-control='no-cache, max-age=0, must-revalidate'
          else
            echo "No library PDFs found; skipping cache refresh."
          fi

name: Upload Library Files To GCS

on:
  push:
    branches:
      - master
    paths:
      - "index.html"
      - "Library/**/*.html"
      - "Library/**/*.pdf"
      - ".github/workflows/upload-html-to-gcs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-library:
    runs-on: ubuntu-latest

    env:
      PRIMARY_GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      SECONDARY_GCS_BUCKET: ravelry-for-adhd-ppl

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload library files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PRIMARY_GCS_BUCKET}" ]]; then
            echo "GCS_BUCKET secret is not set."
            exit 1
          fi

          buckets=("${PRIMARY_GCS_BUCKET}" "${SECONDARY_GCS_BUCKET}")
          stage_dir="$(mktemp -d)"
          trap 'rm -rf "${stage_dir}"' EXIT

          rsync -a \
            --include='/index.html' \
            --include='/Library/' \
            --include='/Library/***' \
            --exclude='ANTLERTOQUE-tincanknits.pdf' \
            --exclude='*' \
            "./" "${stage_dir}/"

          declare -A seen_buckets=()

          for bucket in "${buckets[@]}"; do
            if [[ -z "${bucket}" || -n "${seen_buckets[$bucket]:-}" ]]; then
              continue
            fi

            seen_buckets[$bucket]=1

            echo "Syncing changed published files -> gs://${bucket}"
            gcloud storage rsync "${stage_dir}" "gs://${bucket}" \
              --recursive \
              --cache-control='no-cache, max-age=0'
          done

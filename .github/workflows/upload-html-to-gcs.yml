name: Upload Library Files To GCS

on:
  push:
    branches:
      - master
    paths:
      - "index.html"
      - "Library/**/*.html"
      - "Library/**/*.pdf"
      - ".github/workflows/upload-html-to-gcs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-library:
    runs-on: ubuntu-latest

    env:
      PRIMARY_GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      SECONDARY_GCS_BUCKET: ravelry-for-adhd-ppl

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload library files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PRIMARY_GCS_BUCKET}" ]]; then
            echo "GCS_BUCKET secret is not set."
            exit 1
          fi

          buckets=("${PRIMARY_GCS_BUCKET}" "${SECONDARY_GCS_BUCKET}")

          shopt -s globstar nullglob
          library_files=(index.html Library/**/*.html Library/**/*.pdf)

          if [[ ${#library_files[@]} -eq 0 ]]; then
            echo "No library files found to upload."
            exit 0
          fi

          declare -A seen_buckets=()

          for bucket in "${buckets[@]}"; do
            if [[ -z "${bucket}" || -n "${seen_buckets[$bucket]:-}" ]]; then
              continue
            fi

            seen_buckets[$bucket]=1

            for file in "${library_files[@]}"; do
              target="gs://${bucket}/${file}"
              echo "Uploading ${file} -> ${target}"
              gcloud storage cp --cache-control='no-cache, max-age=0' "${file}" "${target}"
            done
          done
